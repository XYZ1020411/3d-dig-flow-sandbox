<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#091720"><title>3D Dig & Flow Sandbox｜離線農場</title>
<link rel="stylesheet" href="style.css"></head><body>
<canvas id="world"></canvas>
<header class="panel top"><div class="brand"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:24px">🌱</span><div><div class="brandtitle">3D Dig & Flow Sandbox</div><div class="muted">地形水利・農場・魚塭｜離線版</div></div></div><button id="weatherBtn">☀️ 晴天 ↻</button></div>
<div class="metrics"><div class="metric">遊戲日 / 時間<b><span id="day">第 1 日</span> <span id="clock" style="color:#99f6e4">08:00</span></b></div><div class="metric">水體總量<b><span id="waterVol">0</span> m³</b></div><div class="metric">累計蒸發<b><span id="evapVol">0</span> m³</b></div><div class="metric">回收水量<b><span id="drainVol">0</span> m³</b></div><div class="metric">收成 / 魚獲<b><span id="harvest">0</span> 份</b></div><div class="metric">土壤濕度<b><span id="moisture">35</span>%</b></div></div></header>
<section class="panel left"><b>建造工具</b><div class="label">地形塑造</div><div class="grid"><button class="active" data-tool="lower">⛏️ 挖低</button><button data-tool="raise">🧱 填高</button><button data-tool="level">▰ 整平</button><button data-tool="inspect">👆 查看</button></div><div class="label">筆刷範圍</div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="active" data-brush="1">1×1</button><button data-brush="2">2×2</button><button data-brush="3">3×3</button></div><div class="label">水利設施</div><div class="grid"><button data-tool="source">💧 出水泉</button><button data-tool="drain">🌀 回收孔</button><button data-tool="bridge">🌉 木橋</button><button data-tool="alarm">🚨 水位警報</button></div><div class="label">農場與養殖</div><div class="grid"><button data-tool="rice">🌾 水稻</button><button data-tool="corn">🌽 玉米</button><button data-tool="lotus">🪷 荷花</button><button data-tool="willow">🌳 垂柳</button><button data-tool="fish">🐟 魚苗</button><button data-tool="remove">🧹 移除</button></div><div class="muted">點擊格子操作；拖曳旋轉，右鍵拖曳平移，雙指/滾輪縮放。</div></section>
<section class="panel right"><b>時間與環境</b><div class="grid" style="grid-template-columns:repeat(4,1fr)"><button id="pause">Ⅱ</button><button class="active" data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="5">5×</button></div><div class="muted">日夜時間 <span id="timeLabel" style="float:right">08:00</span></div><input id="time" type="range" min="0" max="24" step=".25" value="8" style="width:100%;accent-color:#5eead4"><div class="label">今日天氣</div><div id="weatherText">☀️ 晴天</div><div class="grid"><button id="rain">🌧️ 降雨</button><button id="fill">🌊 補水</button><button id="harvestAll">🧺 收成</button><button id="audio">🔊 音效</button></div><div class="grid"><button id="save">💾 存檔</button><button id="load">📂 讀檔</button><button id="reset">↺ 重置</button><button id="help">❔ 說明</button></div></section>
<div id="brushPreview" aria-hidden="true"></div><div id="toolDock"><button data-tool="lower">⛏️ 挖</button><button data-tool="raise">🧱 填</button><button data-tool="inspect">👆 看</button><button id="moreToggle">＋ 工具</button></div><div id="moreTools"><div class="grid"><button data-tool="level">▰ 整平</button><button data-tool="source">💧 出水泉</button><button data-tool="drain">🌀 回收孔</button><button data-tool="bridge">🌉 木橋</button><button data-tool="alarm">🚨 警報</button><button data-tool="rice">🌾 水稻</button><button data-tool="corn">🌽 玉米</button><button data-tool="lotus">🪷 荷花</button><button data-tool="willow">🌳 垂柳</button><button data-tool="fish">🐟 魚苗</button><button data-tool="remove">🧹 移除</button></div><div class="label">筆刷大小</div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button data-brush="1">1×1</button><button data-brush="2">2×2</button><button data-brush="3">3×3</button></div></div><nav class="panel bottom"><button id="rain2">🌧️ 降雨</button><button id="fill2">🌊 補水</button><button id="harvest2">🧺 收成</button><button id="save2">💾 存檔</button><button id="load2">📂 讀檔</button></nav><div id="toast" class="toast"></div>
<script src="game.js" defer></script></body></html>
