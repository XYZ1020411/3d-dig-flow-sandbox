<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#091720"><title>3D Dig & Flow Sandbox｜離線農場</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#091720;color:#eaf4f5;font-family:system-ui,"Noto Sans TC",sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #ffffff26;background:#ffffff0b;border-radius:10px;padding:8px 7px;font-size:12px;min-height:34px}button.active{border-color:#5eead4;background:#2dd4bf25;color:#99f6e4}#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.panel{position:fixed;z-index:2;background:#0a1822e9;border:1px solid #c2e4e522;border-radius:15px;backdrop-filter:blur(8px);box-shadow:0 8px 25px #0003;padding:10px}.top{top:max(5px,env(safe-area-inset-top));left:6px;right:6px}.brand{display:flex;align-items:center;justify-content:space-between;gap:6px}.brandtitle{font-size:15px;font-weight:750}.muted{font-size:10px;color:#9db4bd}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:7px}.metric{background:#ffffff08;border:1px solid #ffffff10;border-radius:9px;padding:5px;font-size:9px;color:#9db4bd;min-width:0}.metric b{display:block;color:#f2f8f8;font-size:13px;margin-top:2px;white-space:nowrap}.left{left:6px;bottom:calc(65px + env(safe-area-inset-bottom));width:min(44vw,180px);max-height:42dvh;overflow:auto}.right{right:6px;bottom:calc(65px + env(safe-area-inset-bottom));width:min(43vw,175px);max-height:42dvh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin:6px 0 9px}.label{font-size:9px;letter-spacing:.1em;color:#91aab4;margin-top:8px}.bottom{left:6px;right:6px;bottom:max(5px,env(safe-area-inset-bottom));display:flex;gap:5px;overflow-x:auto;white-space:nowrap;padding:6px;scrollbar-width:none}.bottom::-webkit-scrollbar{display:none}.bottom button{flex:0 0 auto;font-size:11px;padding:7px 9px}.toast{position:fixed;z-index:5;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0a1822ee;border:1px solid #ffffff22;border-radius:10px;padding:9px 12px;opacity:0;pointer-events:none;font-size:12px;max-width:90vw;text-align:center}.toast.show{opacity:1}@media(min-width:701px){.top{left:12px;right:12px}.metrics{grid-template-columns:repeat(6,minmax(0,1fr))}.left{top:155px;bottom:auto;left:12px;width:205px;max-height:calc(100vh - 230px)}.right{top:155px;bottom:auto;right:12px;width:205px;max-height:calc(100vh - 230px)}.bottom{left:50%;right:auto;transform:translateX(-50%);max-width:90vw}.brandtitle{font-size:18px}}
@media(max-width:380px){.brandtitle{font-size:13px}.metric{font-size:8px;padding:4px}.metric b{font-size:11px}.left,.right{max-height:37dvh;padding:7px}.left button,.right button{font-size:10px;padding:6px 3px}.top{padding:7px}}
</style></head><body>
<canvas id="world"></canvas>
<header class="panel top"><div class="brand"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:24px">🌱</span><div><div class="brandtitle">3D Dig & Flow Sandbox</div><div class="muted">地形水利・農場・魚塭｜離線版</div></div></div><button id="weatherBtn">☀️ 晴天 ↻</button></div>
<div class="metrics"><div class="metric">遊戲日 / 時間<b><span id="day">第 1 日</span> <span id="clock" style="color:#99f6e4">08:00</span></b></div><div class="metric">水體總量<b><span id="waterVol">0</span> m³</b></div><div class="metric">累計蒸發<b><span id="evapVol">0</span> m³</b></div><div class="metric">回收水量<b><span id="drainVol">0</span> m³</b></div><div class="metric">收成 / 魚獲<b><span id="harvest">0</span> 份</b></div><div class="metric">土壤濕度<b><span id="moisture">35</span>%</b></div></div></header>
<section class="panel left"><b>建造工具</b><div class="label">地形塑造</div><div class="grid"><button class="active" data-tool="lower">⛏️ 挖低</button><button data-tool="raise">🧱 填高</button><button data-tool="level">▰ 整平</button><button data-tool="inspect">👆 查看</button></div><div class="label">筆刷範圍</div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="active" data-brush="1">1×1</button><button data-brush="2">2×2</button><button data-brush="3">3×3</button></div><div class="label">水利設施</div><div class="grid"><button data-tool="source">💧 出水泉</button><button data-tool="drain">🌀 回收孔</button><button data-tool="bridge">🌉 木橋</button><button data-tool="alarm">🚨 水位警報</button></div><div class="label">農場與養殖</div><div class="grid"><button data-tool="rice">🌾 水稻</button><button data-tool="corn">🌽 玉米</button><button data-tool="lotus">🪷 荷花</button><button data-tool="willow">🌳 垂柳</button><button data-tool="fish">🐟 魚苗</button><button data-tool="remove">🧹 移除</button></div><div class="muted">點擊格子操作；拖曳旋轉，右鍵拖曳平移，雙指/滾輪縮放。</div></section>
<section class="panel right"><b>時間與環境</b><div class="grid" style="grid-template-columns:repeat(4,1fr)"><button id="pause">Ⅱ</button><button class="active" data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="5">5×</button></div><div class="muted">日夜時間 <span id="timeLabel" style="float:right">08:00</span></div><input id="time" type="range" min="0" max="24" step=".25" value="8" style="width:100%;accent-color:#5eead4"><div class="label">今日天氣</div><div id="weatherText">☀️ 晴天</div><div class="grid"><button id="rain">🌧️ 降雨</button><button id="fill">🌊 補水</button><button id="harvestAll">🧺 收成</button><button id="audio">🔊 音效</button></div><div class="grid"><button id="save">💾 存檔</button><button id="load">📂 讀檔</button><button id="reset">↺ 重置</button><button id="help">❔ 說明</button></div></section>
<nav class="panel bottom"><button id="rain2">🌧️ 降雨</button><button id="fill2">🌊 補水</button><button id="harvest2">🧺 收成</button><button id="save2">💾 存檔</button><button id="load2">📂 讀檔</button></nav><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const c=document.querySelector('#world'),ctx=c.getContext('2d');let W,H,dpr=1;const N=17,half=8;let heights=[],water=[],moist=[],objects=[],weather=0,day=1,hour=8,speed=1,paused=false,audioOn=true,harvest=0,evap=0,drained=0,tool='lower',brush=1,scale=1,rot=0,panX=0,panY=15,drag=null,last=performance.now();const wx=[{n:'晴天',i:'☀️',e:.0008,r:0,s:'#9ccbd2'},{n:'酷暑',i:'🔥',e:.002,r:0,s:'#d9bd87'},{n:'陰天',i:'☁️',e:.00015,r:0,s:'#7e9ca7'},{n:'小雨',i:'🌧️',e:.0003,r:.002,s:'#789eac'},{n:'暴雨',i:'🌩️',e:.0002,r:.01,s:'#526f83'}];function ix(x,z){return z*N+x}function ok(x,z){return x>=0&&z>=0&&x<N&&z<N}function init(){heights=[];water=[];moist=[];for(let z=0;z<N;z++)for(let x=0;x<N;x++){heights.push(.3+Math.sin(x*.43)*.25+Math.cos(z*.39)*.22);water.push(0);moist.push(.35)}objects=[];weather=0;day=1;hour=8;harvest=evap=drained=0;scale=1;rot=0;panX=0;panY=15;ui();draw()}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=document.documentElement.clientWidth||innerWidth;H=visualViewport?Math.round(visualViewport.height):innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener('resize',resize);if(visualViewport)visualViewport.addEventListener('resize',resize);function proj(x,z,y=0){let a=x-half,b=z-half,ca=Math.cos(rot),sa=Math.sin(rot),rx=a*ca-b*sa,rz=a*sa+b*ca,u=Math.min(W/(N*1.25),H/(N*.85))*scale;return[W/2+panX+(rx-rz)*u*.5,H*.52+panY+(rx+rz)*u*.25-y*u*.65]}function tile(x,z,y){return[proj(x,z,y),proj(x+1,z,y),proj(x+1,z+1,y),proj(x,z+1,y)]}function poly(p,f,s){ctx.beginPath();ctx.moveTo(...p[0]);p.slice(1).forEach(v=>ctx.lineTo(...v));ctx.closePath();ctx.fillStyle=f;ctx.fill();if(s){ctx.strokeStyle=s;ctx.stroke()}}function draw(){if(!ctx)return;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,wx[weather].s);g.addColorStop(1,'#d9e3c6');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let cells=[];for(let z=0;z<N;z++)for(let x=0;x<N;x++)cells.push({x,z});cells.sort((a,b)=>proj(a.x,a.z)[1]-proj(b.x,b.z)[1]);for(let {x,z} of cells){let i=ix(x,z),h=heights[i],p=tile(x,z,h),w=moist[i];poly(p,'rgb('+Math.round(107-w*35)+','+Math.round(112-w*42)+','+Math.round(62+w*15)+')','#d6e9c01c');let b=tile(x,z,h-.28);poly([p[1],p[2],b[2],b[1]],'#574b3a');poly([p[2],p[3],b[3],b[2]],'#3f4935');if(water[i]>.025)poly(tile(x,z,h+Math.min(water[i],.65)),'rgba(47,164,218,.65)','#b9f0ff55')}for(let o of objects){let p=proj(o.x+.5,o.z+.5,heights[ix(o.x,o.z)]+water[ix(o.x,o.z)]);ctx.save();ctx.translate(p[0],p[1]);if(o.type==='source'){ctx.strokeStyle='#d4f9ff';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-24);ctx.stroke();ctx.fillStyle='#60e5ff';ctx.beginPath();ctx.arc(0,-26,5,0,7);ctx.fill()}else if(o.type==='drain'){ctx.fillStyle='#182e3b';ctx.beginPath();ctx.ellipse(0,0,11,5,0,0,7);ctx.fill();ctx.strokeStyle='#8be9d6';ctx.stroke()}else if(o.type==='bridge'){ctx.fillStyle='#9a7045';ctx.fillRect(-22,-7,44,7);for(let k=-2;k<=2;k++)ctx.fillRect(k*8,-9,3,10)}else if(o.type==='alarm'){ctx.fillStyle='#555';ctx.fillRect(-2,-18,4,18);ctx.fillStyle=Math.sin(performance.now()/150)>0?'#ff3b4f':'#7e202b';ctx.beginPath();ctx.arc(0,-20,6,0,7);ctx.fill()}else if(['rice','corn'].includes(o.type)){ctx.strokeStyle='#4d9b43';ctx.lineWidth=2;for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*3,0);ctx.lineTo(k*4-5,-12-Math.min(10,o.age||0));ctx.stroke()}if(o.age>10){ctx.fillStyle='#e4c34d';ctx.fillRect(4,-19,4,8)}}else if(o.type==='lotus'){ctx.fillStyle='#3b9e65';ctx.beginPath();ctx.ellipse(0,0,12,5,0,0,7);ctx.fill();ctx.fillStyle='#f28ab6';ctx.beginPath();ctx.arc(0,-7,7,0,7);ctx.fill()}else if(o.type==='willow'){ctx.fillStyle='#795438';ctx.fillRect(-2,-24,4,24);ctx.fillStyle='#4b9348';for(let k=0;k<6;k++){ctx.beginPath();ctx.arc(Math.sin(k*5)*9,-25-(k%3)*6,9,0,7);ctx.fill()}}else if(o.type==='fish'){ctx.fillStyle='#f4a261';ctx.beginPath();ctx.ellipse(Math.sin(performance.now()/400+o.x)*4,0,9,4,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-15,-4);ctx.lineTo(-15,4);ctx.fill()}ctx.restore()}if(weather>=3){ctx.strokeStyle='#d5f3ff88';for(let k=0;k<(weather===4?100:40);k++){let x=(k*97+performance.now()*.2)%W,y=(k*61+performance.now()*(weather===4?1:.5))%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+10);ctx.stroke()}}document.querySelector('#waterVol').textContent=water.reduce((a,b)=>a+b,0).toFixed(1);document.querySelector('#evapVol').textContent=evap.toFixed(1);document.querySelector('#drainVol').textContent=drained.toFixed(1);document.querySelector('#harvest').textContent=harvest;document.querySelector('#moisture').textContent=Math.round(moist.reduce((a,b)=>a+b,0)/moist.length*100)}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function tone(f=300){if(!audioOn)return;try{let a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.stop(a.currentTime+.1);setTimeout(()=>a.close(),250)}catch(e){}}function ui(){document.querySelector('#day').textContent='第 '+day+' 日';let t=String(hour|0).padStart(2,'0')+':'+String(Math.floor(hour%1*60)).padStart(2,'0');document.querySelector('#clock').textContent=t;document.querySelector('#timeLabel').textContent=t;document.querySelector('#time').value=hour;document.querySelector('#weatherBtn').textContent=wx[weather].i+' '+wx[weather].n+' ↻';document.querySelector('#weatherText').textContent=wx[weather].i+' '+wx[weather].n}function cell(px,py){let best=null,bd=1e9;for(let z=0;z<N;z++)for(let x=0;x<N;x++){let p=proj(x+.5,z+.5,heights[ix(x,z)]),d=(p[0]-px)**2+(p[1]-py)**2;if(d<bd){bd=d;best={x,z}}}return bd<Math.min(W,H)**2*.025?best:null}function act(x,z){if(!ok(x,z))return;let list=[];for(let dz=0;dz<brush;dz++)for(let dx=0;dx<brush;dx++){let xx=x+dx-(brush>>1),zz=z+dz-(brush>>1);if(ok(xx,zz))list.push(ix(xx,zz))}if(['lower','raise','level'].includes(tool)){let a=list.reduce((s,i)=>s+heights[i],0)/list.length;for(let i of list){if(tool==='lower')heights[i]=Math.max(-1.2,heights[i]-.22);else if(tool==='raise')heights[i]=Math.min(3.5,heights[i]+.22);else heights[i]+=(a-heights[i])*.65}tone(tool==='lower'?170:260);toast('地形已更新')}else if(tool==='inspect'){let i=ix(x,z);toast('高度 '+heights[i].toFixed(1)+' m｜水深 '+water[i].toFixed(1)+' m')}else if(tool==='remove'){let j=objects.findIndex(o=>Math.hypot(o.x-x,o.z-z)<2);if(j>=0){objects.splice(j,1);toast('已移除物件')}else toast('附近沒有物件')}else{if(tool==='lotus'&&water[ix(x,z)]<.05)return toast('荷花需要水面');if(tool==='fish'&&water[ix(x,z)]<.25)return toast('魚苗需要深水區');objects.push({x,z,type:tool,age:0});tone(430);toast('已放置物件')}draw()}let down=null;c.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false,button:e.button};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-down.px,dy=e.clientY-down.py;if(Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>5)down.moved=true;if(down.moved){if(e.buttons===2||down.button===2){panX+=dx;panY+=dy}else{rot+=dx*.008;panY+=dy*.25}down.px=e.clientX;down.py=e.clientY;draw()}});c.addEventListener('pointerup',e=>{if(down&&!down.moved){let p=cell(e.clientX,e.clientY);if(p)act(p.x,p.z)}down=null});c.addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('wheel',e=>{scale=Math.max(.55,Math.min(2.2,scale*(e.deltaY>0?.92:1.08)));draw();e.preventDefault()},{passive:false});c.addEventListener('touchmove',e=>{if(e.touches.length===2){let dx=e.touches[0].clientX-e.touches[1].clientX;scale=Math.max(.55,Math.min(2.2,scale+dx*.0005));draw()}},{passive:true});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('active',v===b));toast('工具：'+b.textContent)});document.querySelectorAll('[data-brush]').forEach(b=>b.onclick=()=>{brush=+b.dataset.brush;document.querySelectorAll('[data-brush]').forEach(v=>v.classList.toggle('active',v===b))});document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(v=>v.classList.toggle('active',v===b))});document.querySelector('#weatherBtn').onclick=()=>{weather=(weather+1)%wx.length;ui();draw()};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};document.querySelector('#time').oninput=e=>{hour=+e.target.value;ui();draw()};function rain(){for(let k=0;k<45;k++){let i=ix(Math.random()*N|0,Math.random()*N|0);water[i]=Math.min(1.4,water[i]+.12);moist[i]=Math.min(1,moist[i]+.08)}weather=3;ui();draw();toast('降雨完成')}function fill(){water=water.map(v=>Math.min(1.3,v+.12));draw();toast('已補充水量')}function collect(){let n=0;objects=objects.filter(o=>{if(['rice','corn','fish','lotus'].includes(o.type)){n++;return false}return true});harvest+=n;draw();toast('收成 '+n+' 份')}function save(){try{localStorage.setItem('digflow-offline-save',JSON.stringify({heights,water,moist,objects,weather,day,hour,harvest,evap,drained}));toast('已存檔至本機')}catch(e){toast('瀏覽器不允許本機存檔')}}function load(){try{let s=JSON.parse(localStorage.getItem('digflow-offline-save'));if(!s)throw 0;({heights,water,moist,objects,weather,day,hour,harvest,evap,drained}=s);ui();draw();toast('讀檔完成')}catch(e){toast('找不到存檔')}}document.querySelectorAll('#rain,#rain2').forEach(b=>b.onclick=rain);document.querySelectorAll('#fill,#fill2').forEach(b=>b.onclick=fill);document.querySelectorAll('#harvestAll,#harvest2').forEach(b=>b.onclick=collect);document.querySelectorAll('#save,#save2').forEach(b=>b.onclick=save);document.querySelectorAll('#load,#load2').forEach(b=>b.onclick=load);document.querySelector('#reset').onclick=()=>{if(confirm('確定重置地形與進度？'))init()};document.querySelector('#audio').onclick=()=>{audioOn=!audioOn;document.querySelector('#audio').textContent=audioOn?'🔊 音效':'🔇 靜音';tone(500)};document.querySelector('#help').onclick=()=>alert('離線版操作：點地形使用工具；拖曳旋轉，右鍵拖曳平移，滾輪縮放。挖低、填高、整平可改變地形。水源、回收孔、農作物等可放置地面。存檔保存在此瀏覽器本機。');function tick(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(!paused){hour+=dt*.18*speed;if(hour>=24){hour-=24;day++;weather=Math.random()*wx.length|0;ui()}let w=wx[weather];for(let i=0;i<water.length;i++){if(water[i]>.005){let x=i%N,z=i/N|0,best=-1,low=heights[i]+water[i];for(let [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){let xx=x+dx,zz=z+dz;if(ok(xx,zz)){let j=ix(xx,zz);if(low>heights[j]+water[j]+.08&&(best<0||heights[j]+water[j]<heights[best]))best=j}}if(best>=0&&Math.random()<dt*speed*1.8){water[i]=Math.max(0,water[i]-.02);water[best]=Math.min(1.3,water[best]+.02)}let willow=objects.some(o=>o.type==='willow'&&Math.hypot(o.x-x,o.z-z)<3),e=Math.min(water[i],w.e*dt*speed*(willow?.4:1));water[i]-=e;evap+=e}moist[i]=Math.min(1,Math.max(.08,moist[i]+w.r*dt*speed-water[i]*.0001))}for(let o of objects){let i=ix(o.x,o.z);if(o.type==='source')water[i]=Math.min(1.3,water[i]+dt*.12*speed);if(o.type==='drain'){let n=Math.min(water[i],dt*.12*speed);water[i]-=n;drained+=n}if(['rice','corn','fish','lotus'].includes(o.type))o.age+=dt*speed;if(o.type==='alarm'&&water[i]>.6&&Math.random()<.03)tone(850)}}ui();draw();requestAnimationFrame(tick)}init();resize();requestAnimationFrame(tick)})();
</script></body></html>
